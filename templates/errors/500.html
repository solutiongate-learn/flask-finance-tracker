{% extends "base.html" %}
{% block title %}Server Error — {{ app_name }}{% endblock %}
{% block content %}
<div style="text-align:center;padding:6rem 2rem;">
    <div style="font-size:4rem;margin-bottom:1rem;">500</div>
    <h1 style="font-family:var(--font-display);font-size:2rem;margin-bottom:1rem;">Something went wrong</h1>
    <p style="color:var(--ink-muted);margin-bottom:2rem;">An unexpected error occurred. Please try again.</p>
    <a href="{{ url_for('auth.landing') }}" class="btn-primary">Go home</a>
</div>
{% endblock %}
